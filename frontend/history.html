<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldDocs - History</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-base: #020612;
            --bg-panel: rgba(10, 15, 30, 0.4);
            --bg-nav: rgba(5, 10, 20, 0.85);
            --primary: #3b82f6;
            --primary-glow: #60a5fa;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.08);
            --radius-lg: 16px;
            --radius-sm: 8px;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        .app-layout { display: flex; width: 100vw; height: 100vh; overflow: hidden; }

        .ambient-lines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.15; pointer-events: none;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 100px, rgba(255,255,255,0.05) 100px, rgba(255,255,255,0.05) 101px);
        }

        .bg-glows {
            position: fixed; top:0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
            background-image: radial-gradient(ellipse at 0% 0%, rgba(59, 130, 246, 0.1) 0%, transparent 40%),
                              radial-gradient(ellipse at 100% 100%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width); background: var(--bg-nav); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; z-index: 100; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
        }
        .sidebar.collapsed { --sidebar-width: 80px; }
        .sidebar.collapsed .nav-label, .sidebar.collapsed .logo-text, .sidebar.collapsed .user-details { opacity: 0; width: 0; overflow: hidden; pointer-events: none; }

        .sidebar-header {
            height: 80px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.03); white-space: nowrap;
        }
        .sidebar.collapsed .sidebar-header { justify-content: center; padding: 0; }

        .logo-wrap { display: flex; align-items: center; gap: 12px; }
        .logo-icon { filter: drop-shadow(0 4px 10px rgba(99, 102, 241, 0.4)); flex-shrink: 0; }
        .logo-text { 
            font-weight: 800; font-size: 1.35rem; letter-spacing: -0.03em;
            background: linear-gradient(135deg, #AEB9C8 0%, #6F8FB8 50%, #2F6FE4 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }

        .btn-collapse {
            position: absolute; right: -14px; top: 32px;
            background: var(--bg-nav); border: 1px solid rgba(255,255,255,0.1); 
            color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
            width: 28px; height: 28px; border-radius: 50%; transition: all 0.3s;
            z-index: 101; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .btn-collapse svg { width: 16px; height: 16px; transition: transform 0.3s; }
        .sidebar.collapsed .btn-collapse svg { transform: rotate(180deg); }
        
        /* Nav Items */
        .sidebar-nav { flex-grow: 1; padding: 24px 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 16px; padding: 14px 24px; text-decoration: none; font-size: 0.95rem; font-weight: 600; color: var(--text-muted); border-left: 3px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .sidebar.collapsed .nav-item { padding: 14px 0; justify-content: center; }
        .nav-icon { width: 22px; height: 22px; flex-shrink: 0; transition: transform 0.2s, color 0.2s; }
        .nav-item:hover { color: var(--text-main); background: rgba(255,255,255,0.02); }
        .nav-item.active { color: var(--primary-glow); background: linear-gradient(90deg, rgba(59,130,246,0.1) 0%, transparent 100%); border-left-color: var(--primary); box-shadow: inset 4px 0 15px rgba(59,130,246,0.15); }
        .nav-item.active .nav-icon { color: var(--primary); filter: drop-shadow(0 0 6px rgba(59,130,246,0.5)); }

        .nav-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.2); padding: 8px 24px; margin-top: 16px; font-weight: 700; white-space: nowrap; }

        /* Sidebar Bottom */
        .sidebar-footer { padding: 24px 0; border-top: 1px solid rgba(255,255,255,0.03); }
        .user-profile { display: flex; align-items: center; gap: 12px; padding: 0 24px; text-decoration: none; white-space: nowrap; }
        .nav-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; color: #fff; flex-shrink: 0; }
        .user-details { display: flex; flex-direction: column; gap: 4px; }
        .user-name { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
        .user-role { font-size: 0.75rem; color: var(--text-muted); }

        /* Main Content */
        .main-content { flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .dashboard-header { padding: 20px 48px 12px 48px; display: flex; justify-content: space-between; align-items: flex-end; flex-shrink: 0;}
        .db-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; }
        .db-subtitle { font-size: 0.95rem; color: var(--text-muted); margin-top: 8px; }

        /* History Specific Styles */
        .content-container { padding: 24px 48px; flex-grow: 1; overflow-y: auto; }
        .doc-list { display: flex; flex-direction: column; gap: 12px; }
        .doc-item { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--border); 
            padding: 16px 24px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s;
        }
        .doc-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); transform: translateX(4px); }
        .doc-info { display: flex; flex-direction: column; gap: 4px; }
        .doc-name { font-weight: 600; color: var(--text-main); }
        .doc-meta { font-size: 0.8rem; color: var(--text-muted); }
        
        .doc-actions { display: flex; gap: 12px; }
        .primary-btn { 
            background: var(--primary); color: #fff; border: none; padding: 8px 16px; 
            border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); text-decoration: none; font-size: 0.9rem;
        }
        .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4); opacity: 0.9; }

        .secondary-btn {
            background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; 
            border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.9rem;
        }
        .secondary-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }

        .loader-container { display: flex; justify-content: center; padding: 60px; }
        .loader { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="ambient-lines"></div>
    <div class="bg-glows"></div>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-wrap">
                    <svg class="logo-icon" viewBox="0 0 110 120" style="width: 32px; height: 35px;">
                        <path d="M 55 12 L 100 24 L 100 65 C 100 95 55 115 55 115 C 55 115 10 95 10 65 L 10 24 Z" fill="#6366f1"/>
                        <path d="M 55 23 L 80 29.5 L 80 43 L 90 43 L 90 64 C 90 88 55 103 55 103 C 55 103 20 88 20 64 L 20 32 Z" fill="#f8fafc"/>
                        <path d="M 80 29.5 L 90 43 L 80 43 Z" fill="#3b82f6"/>
                        <circle cx="55" cy="56" r="6" fill="#0f172a"/>
                        <path d="M 52 58 L 58 58 L 61 74 L 49 74 Z" fill="#0f172a"/>
                    </svg>
                    <span class="logo-text">ShieldDocs</span>
                </div>
                <!-- Desktop collapse -->
                <button class="btn-collapse" id="toggleBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-section-title">Main Menu</div>
                <a href="dashboard.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="redact.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                    <span class="nav-label">Text Redaction</span>
                </a>
                <a href="file-redact.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline><rect x="6" y="14" width="12" height="6" rx="2" ry="2"></rect></svg>
                    <span class="nav-label">File Redaction</span>
                </a>
                
                <div class="nav-section-title">Records</div>
                <a href="history.html" class="nav-item active">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span class="nav-label">History</span>
                </a>
                <a href="bin.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    <span class="nav-label">Bin</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn">
                    <div class="nav-avatar" id="userAvatar">??</div>
                    <div class="user-details">
                        <span class="user-name" id="userName">Loading...</span>
                        <span class="user-role">Administrator</span>
                    </div>
                </div>
                <!-- Profile Dropdown -->
                <div class="profile-dropdown" id="profileDropdown">
                    <a href="profile.html" class="dropdown-item">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        View Profile
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item danger" id="logoutBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Sign Out
                    </a>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1 class="db-title">Document History</h1>
                    <p class="db-subtitle">Manage and view your previously processed documents.</p>
                </div>
            </div>

            <div class="content-container">
                <div id="history-list" class="doc-list">
                    <div class="loader-container"><div class="loader"></div></div>
                </div>
            </div>
        </main>
    </div>

    <script src="user-manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const listContainer = document.getElementById('history-list');
            const token = localStorage.getItem('shieldDocsToken');

            // Sidebar Toggle
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggleBtn');
            toggleBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch('http://127.0.0.1:5000/api/documents', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Failed to fetch history');
                const docs = await response.json();
                
                listContainer.innerHTML = '';
                if (!docs || docs.length === 0) {
                    listContainer.innerHTML = '<p style="text-align:center; padding: 40px; color: var(--text-muted);">No documents found.</p>';
                } else {
                    docs.forEach(doc => {
                        const div = document.createElement('div');
                        div.className = 'doc-item';
                        div.innerHTML = `
                            <div class="doc-info">
                                <span class="doc-name">${doc.file_name}</span>
                                <span class="doc-meta">${doc.file_type.toUpperCase()} • ${new Date(doc.created_at).toLocaleString()}</span>
                            </div>
                            <div class="doc-actions">
                                ${doc.file_path ? `<a href="http://127.0.0.1:5000/${doc.file_path}" class="primary-btn" target="_blank">Download</a>` : ''}
                                <button class="secondary-btn delete-btn" data-id="${doc.id}">Delete</button>
                            </div>
                        `;
                        listContainer.appendChild(div);
                    });

                    // Add delete listeners
                    document.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            if (!confirm('Move to Bin?')) return;
                            const id = btn.dataset.id;
                            const res = await fetch(`http://127.0.0.1:5000/api/documents/${id}`, {
                                method: 'DELETE',
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            if (res.ok) location.reload();
                        });
                    });
                }
            } catch (err) {
                console.error(err);
                listContainer.innerHTML = '<p style="color:red; text-align:center; padding: 40px;">Error loading documents.</p>';
            }
        });
    </script>
</body>
</html>
