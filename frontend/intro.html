<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldDocs - Interactive Scrubbing Intro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100vh;
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: white;
            cursor: pointer;
        }

        /* Central Alignments */
        .centered-fixed {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at 50% 50%, rgba(59, 130, 246, 0.06) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }

        .particle {
            position: absolute;
            background: #3b82f6;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            opacity: 0.15;
            box-shadow: 0 0 6px #3b82f6;
            z-index: 1;
            pointer-events: none;
            will-change: top, transform;
        }

        #shield-glow {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, rgba(59, 130, 246, 0) 65%);
            z-index: 5;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            transition: transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease;
            pointer-events: none;
        }

        #shield-glow.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #scene {
            width: 100vw;
            height: 100vh;
            z-index: 20;
            pointer-events: none;
            will-change: transform;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .pii {
            position: absolute;
            top: 50%;
            left: 50%;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 500;
            white-space: nowrap;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
            will-change: transform, opacity, filter;
        }

        #doc-card {
            width: 460px;
            height: 560px;
            background: #f5f5f5;
            border-radius: 12px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.65);
            will-change: transform, opacity, box-shadow, border;
            overflow: hidden;
            border: 1px solid transparent;
            z-index: 25;
        }

        #doc-card.secured {
            border-color: rgba(255, 255, 255, 0.25);
            transition: border-color 1.5s ease;
        }

        .doc-line {
            position: absolute;
            left: 36px;
            right: 36px;
            height: 26px;
            background: #e2e8f0;
            border-radius: 4px;
            opacity: 0;
            overflow: hidden;
            will-change: opacity;
        }

        .redact-bar {
            position: absolute;
            top: -1px;
            left: -2px;
            bottom: -1px;
            background: #050505;
            width: 0%;
            transform-origin: left center;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.7);
            border-radius: 2px;
            will-change: width, transform;
        }

        #card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.85);
            opacity: 0;
            z-index: 50;
            will-change: opacity;
        }

        #branding {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #logo {
            font-size: 4.8rem;
            letter-spacing: -3px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #3b82f6 80%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transform: translateY(20px);
            will-change: transform, opacity;
        }

        #tagline {
            font-size: 1.15rem;
            color: #cbd5e1;
            letter-spacing: 4px;
            font-weight: 500;
            text-transform: uppercase;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(20px);
            will-change: transform, opacity;
        }

        #cta-text {
            color: #64748b;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0;
            transform: translateY(20px);
            will-change: transform, opacity;
        }

        #cta-text.pulse {
            animation: ctaPulse 2.5s infinite ease-in-out;
        }

        @keyframes ctaPulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
                color: #f8fafc;
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            }
        }

        .fade-out {
            opacity: 0 !important;
            transition: opacity 0.5s ease;
        }
    </style>
</head>

<body>
    <div id="bg-gradient"></div>
    <div id="shield-glow" class="centered-fixed"></div>

    <div id="doc-card" class="centered-fixed">
        <div id="card-overlay"></div>
    </div>
    <div id="scene" class="centered-fixed"></div>

    <div id="branding">
        <div id="logo">Shield<span>Docs</span></div>
        <div id="tagline">Filter. Redact. Protect.</div>
        <div id="cta-text">Point right to accelerate sequence</div>
    </div>

    <script>
        const PII_DATA = [
            'john.doe@company.com', '555-123-4567', 'SSN: ***-**-1234', 'ID: USER-47291',
            'john.smith@corp.net', 'Card: 4916-****-****', 'PIN: 7482', 'mary.j@enterprise.org',
            '202-555-0198', 'License: DL-AB123456', 'DOB: 05/12/1985', 'admin@secure.co',
            'Acct# 1234567890', 'Bal: $14,293.45', 'sarah.wilson@bizmail.com',
            'Token: eyJhbGci...', 'IP: 192.168.1.100', 'EmpID: E-8472', 'Salary: $124,500',
            'MAC: AA:BB:CC', 'API-Key: sk-abc123', 'Routing: 02100', 'Deal: $2.4M'
        ];

        const lerp = (a, b, t) => a + (b - a) * t;
        // Approximation for cubic-bezier(0.22, 1, 0.36, 1) -> nice fast out smooth in
        const easeCustom = t => 1 - Math.pow(1 - t, 4);
        const easeOutBack = t => {
            const c1 = 1.70158;
            return 1 + (c1 + 1) * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        };

        const scene = document.getElementById('scene');
        const docCard = document.getElementById('doc-card');
        const cardOverlay = document.getElementById('card-overlay');
        const shieldGlow = document.getElementById('shield-glow');
        const logo = document.getElementById('logo');
        const tagline = document.getElementById('tagline');
        const cta = document.getElementById('cta-text');

        // Dynamic Generative Elements
        const elements = [];
        for (let i = 0; i < 55; i++) {
            const el = document.createElement('div');
            el.className = 'pii';
            el.textContent = PII_DATA[Math.floor(Math.random() * PII_DATA.length)];

            const fontSize = 10 + Math.random() * 18;
            el.style.fontSize = fontSize + 'px';
            const initOpacity = 0.5 + Math.random() * 0.5;

            const initX = (Math.random() - 0.5) * window.innerWidth * 1.1;
            const initY = (Math.random() - 0.5) * window.innerHeight * 1.1;

            const driftVx = (Math.random() - 0.5) * 1.8;
            const driftVy = (Math.random() - 0.5) * 1.8;

            const col = Math.floor(i / 11);
            const row = i % 11;
            const targetX = -180 + col * 105 + (Math.random() * 10);
            const targetY = -230 + row * 45;

            const curveX = (Math.random() - 0.5) * 250;
            const curveY = (Math.random() - 0.5) * 250;

            elements.push({
                el, initX, initY, targetX, targetY, curveX, curveY,
                driftVx, driftVy, initOpacity,
                delay: i * 0.0015
            });
            scene.appendChild(el);
        }

        const particles = [];
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = (Math.random() * 100) + 'vw';
            p.style.top = (Math.random() * 100) + 'vh';
            document.body.appendChild(p);
            particles.push({ p, speed: 0.2 + Math.random() * 0.6 });
        }

        const lines = [];
        for (let r = 0; r < 12; r++) {
            const line = document.createElement('div');
            line.className = 'doc-line';
            line.style.top = (30 + r * 42) + 'px';
            line.style.width = (65 + Math.random() * 25) + '%';

            const isSensitive = Math.random() > 0.45;
            let bar = null;
            if (isSensitive) {
                bar = document.createElement('div');
                bar.className = 'redact-bar';
                line.appendChild(bar);
            }
            docCard.appendChild(line);
            lines.push({ line, bar, isSensitive });
        }

        // Timeline System Control (Forward-Only Speed Dynamics)
        let progress = 0;
        let targetSpeed = 0;
        let currentSpeed = 0;
        const baseSpeed = 0.0015;
        const boostFactor = 0.015;

        let mouseX = 0, mouseY = 0;
        let pMouseX = 0, pMouseY = 0;

        document.addEventListener('mousemove', (e) => {
            // Speed mapped to horizontal axis
            let mousePct = Math.max(0, Math.min(1, e.clientX / window.innerWidth));
            targetSpeed = mousePct * boostFactor;

            // Parallax positioning tracking
            mouseX = mousePct - 0.5;
            mouseY = (e.clientY / window.innerHeight) - 0.5;
        });

        document.addEventListener('wheel', (e) => {
            targetSpeed += (e.deltaY > 0 ? 1 : -1) * 0.002;
            targetSpeed = Math.max(0, Math.min(boostFactor * 1.5, targetSpeed));
        });

        const bgGradient = document.getElementById('bg-gradient');

        // Main Rendering Loop
        function renderFrame() {
            // Forward Inertia Momentum Calculation
            currentSpeed += (targetSpeed - currentSpeed) * 0.08;

            // Core progression (progress ONLY increases)
            const tickSpeed = baseSpeed + Math.max(0, currentSpeed);
            progress += tickSpeed;
            if (progress > 1) progress = 1;

            const p = progress;
            const speedIntensity = Math.max(0, Math.min(1, currentSpeed / boostFactor));

            // Parallax depth smoothing
            pMouseX = lerp(pMouseX, mouseX, 0.05);
            pMouseY = lerp(pMouseY, mouseY, 0.05);

            bgGradient.style.marginLeft = `${pMouseX * -60}px`;
            bgGradient.style.marginTop = `${pMouseY * -60}px`;

            particles.forEach((obj, i) => {
                let top = parseFloat(obj.p.style.top);
                top -= obj.speed * (0.05 + currentSpeed * 5); // Particles react to speed!
                if (top < -2) top = 102;
                obj.p.style.top = top + 'vh';
                obj.p.style.transform = `translate(${pMouseX * -90 * obj.speed}px, ${pMouseY * -90 * obj.speed}px)`;
            });

            shieldGlow.style.marginLeft = `${pMouseX * -25}px`;
            shieldGlow.style.marginTop = `${pMouseY * -25}px`;

            const focusOffsetX = pMouseX * 12;
            const focusOffsetY = pMouseY * 12;
            scene.style.marginLeft = `${focusOffsetX}px`;
            scene.style.marginTop = `${focusOffsetY}px`;
            docCard.style.marginLeft = `${focusOffsetX}px`;
            docCard.style.marginTop = `${focusOffsetY}px`;

            document.getElementById('branding').style.marginLeft = `${pMouseX * 35}px`;
            document.getElementById('branding').style.marginTop = `${pMouseY * 35}px`;

            // Core Timeline
            const driftFrames = Math.min(p / 0.3, 1) * 110;

            elements.forEach(f => {
                const driftEndX = f.initX + f.driftVx * 110;
                const driftEndY = f.initY + f.driftVy * 110;

                let curX = f.initX + f.driftVx * driftFrames;
                let curY = f.initY + f.driftVy * driftFrames;
                let scale = 1;
                let blur = 0;
                let finalOpacity = f.initOpacity;

                if (p < 0.3) {
                    if (Math.random() < 0.04 && (Date.now() % 300) < 100) {
                        curX += (Math.random() - 0.5) * 5;
                        f.el.style.textShadow = `2px 0 0 #ff3b3b, -2px 0 0 #3b82f6`;
                    } else {
                        f.el.style.textShadow = `0 0 6px rgba(255,255,255,0.4)`;
                    }
                } else if (p < 0.5) {
                    const p2Time = (p - 0.3) / 0.2;
                    const staggerDelay = f.delay * 15;
                    let t = Math.max(0, Math.min(1, (p2Time - staggerDelay) * 1.2));
                    const e = easeCustom(t);

                    const arcX = Math.sin(e * Math.PI) * f.curveX;
                    const arcY = Math.sin(e * Math.PI) * f.curveY;

                    curX = lerp(driftEndX, f.targetX * 0.65, e) + arcX;
                    curY = lerp(driftEndY, f.targetY * 0.65, e) + arcY;
                    scale = lerp(1, 0.65, e);
                    blur = Math.sin(e * Math.PI) * 2.5;
                    f.el.style.textShadow = `0 0 6px rgba(255,255,255,0.4)`;
                } else {
                    const p3Time = Math.min((p - 0.5) / 0.2, 1);
                    const e = easeCustom(p3Time);
                    const curScaleInner = lerp(0.65, 1, e);

                    curX = f.targetX * curScaleInner;
                    curY = f.targetY * curScaleInner;
                    scale = curScaleInner;
                    finalOpacity = lerp(f.initOpacity, 0, e * 1.5);
                    f.el.style.textShadow = `0 0 6px rgba(255,255,255,0.4)`;
                }

                f.el.style.transform = `translate(-50%, -50%) translate(${curX}px, ${curY}px) scale(${scale})`;
                f.el.style.filter = blur > 0 ? `blur(${blur}px)` : 'none';
                f.el.style.opacity = Math.max(0, finalOpacity);
            });

            if (p >= 0.3 && p < 0.5) {
                const p2Time = (p - 0.3) / 0.2;
                const shake = (1 - p2Time) * 2;
                scene.style.transform = `translate(-50%, -50%) translate(${(Math.random() - 0.5) * shake}px, ${(Math.random() - 0.5) * shake}px)`;
            } else {
                scene.style.transform = `translate(-50%, -50%)`;
            }

            let docScale = 0.65;
            let docOpacity = 0;
            if (p >= 0.5) {
                const p3Time = Math.min((p - 0.5) / 0.2, 1);
                const e = easeCustom(p3Time);
                docScale = lerp(0.65, 1, e);
                docOpacity = lerp(0, 1, e);
            }
            docCard.style.transform = `translate(-50%, -50%) scale(${docScale})`;
            docCard.style.opacity = docOpacity;

            lines.forEach(l => l.line.style.opacity = docOpacity);

            // Speed Velocity Feedback Glow
            if (p >= 0.5) {
                docCard.style.boxShadow = `0 40px 100px rgba(0,0,0,0.9), 0 0 ${20 + speedIntensity * 40}px rgba(59,130,246,${0.06 + speedIntensity * 0.3})`;
            }

            let sensitiveCount = 0;
            lines.forEach((l) => {
                if (l.isSensitive && l.bar) {
                    if (p < 0.7) {
                        l.bar.style.width = '0%';
                        l.bar.style.transform = 'skewX(0deg)';
                    } else if (p >= 0.7 && p < 0.9) {
                        const p4Time = (p - 0.7) / 0.2;
                        const delay = sensitiveCount * 0.08;
                        const t = Math.max(0, Math.min(1, (p4Time - delay) * 2.2));
                        const e = easeOutBack(t);
                        l.bar.style.width = Math.max(0, Math.min(104, e * 100)) + '%';
                        const skew = Math.sin(t * Math.PI) * 2.5;
                        l.bar.style.transform = `skewX(${-skew}deg)`;
                    } else {
                        l.bar.style.width = '100%';
                        l.bar.style.transform = 'skewX(0deg)';
                    }
                    sensitiveCount++;
                }
            });

            let bgDepth = 10;
            let overlayOpacity = 0;

            if (p < 0.9) {
                docCard.classList.remove('secured');
                shieldGlow.classList.remove('active');
                cta.classList.remove('pulse');
                logo.style.opacity = 0; tagline.style.opacity = 0; cta.style.opacity = 0;
            }

            if (p >= 0.9) {
                const p5Time = Math.min((p - 0.9) / 0.1, 1);
                const e = easeCustom(p5Time);
                bgDepth = Math.floor(lerp(10, 5, e));
                overlayOpacity = lerp(0, 1, e);

                if (p > 0.95) {
                    docCard.classList.add('secured');
                    shieldGlow.classList.add('active');
                }

                const tLogo = easeCustom(Math.max(0, Math.min(1, p5Time * 1.5)));
                const tTag = easeCustom(Math.max(0, Math.min(1, (p5Time - 0.2) * 1.5)));
                const tCta = easeCustom(Math.max(0, Math.min(1, (p5Time - 0.4) * 1.5)));

                logo.style.transform = `translateY(${lerp(20, 0, tLogo)}px)`;
                logo.style.opacity = tLogo;

                tagline.style.transform = `translateY(${lerp(20, 0, tTag)}px)`;
                tagline.style.opacity = tTag;

                cta.style.transform = `translateY(${lerp(20, 0, tCta)}px)`;
                cta.style.opacity = tCta;
                cta.innerText = "Click anywhere to continue";

                if (tCta >= 1) cta.classList.add('pulse');
            } else {
                cta.innerText = "Point right to accelerate sequence";
                cta.style.opacity = 0.5;
                cta.style.transform = `translateY(0px)`;
            }

            document.body.style.backgroundColor = `rgb(${bgDepth}, ${bgDepth}, ${bgDepth})`;
            cardOverlay.style.opacity = overlayOpacity;

            requestAnimationFrame(renderFrame);
        }

        requestAnimationFrame(renderFrame);

        document.body.addEventListener('click', () => {
            if (progress < 0.8) return;
            document.body.classList.add('fade-out');
            setTimeout(() => window.location.href = 'login.html', 400);
        });
    </script>
</body>

</html>
