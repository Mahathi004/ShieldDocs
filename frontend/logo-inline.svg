<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
      .logo-text {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -1.5px;
        fill: #f8fafc; /* White for dark UI */
      }
    </style>
  </defs>

  <!-- Outer Shield (Blue) -->
  <path d="M 55 12 L 100 24 L 100 65 C 100 95 55 115 55 115 C 55 115 10 95 10 65 L 10 24 Z" fill="#6366f1"/>
  
  <!-- Inner Shield / Document Base (White) -->
  <path d="M 55 23 L 80 29.5 L 80 43 L 90 43 L 90 64 C 90 88 55 103 55 103 C 55 103 20 88 20 64 L 20 32 Z" fill="#f8fafc"/>

  <!-- Document Fold (Blue) -->
  <path d="M 80 29.5 L 90 43 L 80 43 Z" fill="#3b82f6"/>

  <!-- Keyhole (Dark) -->
  <circle cx="55" cy="56" r="6" fill="#0f172a"/>
  <path d="M 52 58 L 58 58 L 61 74 L 49 74 Z" fill="#0f172a"/>

  <!-- Separator Line -->
  <line x1="125" y1="30" x2="125" y2="95" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Text -->
  <text x="145" y="80" class="logo-text">Shield<tspan fill="#3b82f6">Docs</tspan></text>
</svg>
