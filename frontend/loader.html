<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap');
        
        body {
            background-color: #0b1220;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
            /* smooth entry */
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .spinner-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            margin-bottom: 32px;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(59, 130, 246, 0.15); /* light faint blue bg */
            border-top-color: #3b82f6; /* bright accent blue */
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            box-sizing: border-box;
        }

        /* Inner subtle pulse for a premium feel */
        .spinner-inner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            background: #3b82f6;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
            opacity: 0.5;
            filter: blur(4px);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            animation: pulse-text 1.5s ease-in-out infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        @keyframes pulse-dot {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.3; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.6; }
        }

        .fade-out {
            transition: opacity 0.4s ease;
            opacity: 0 !important;
        }
    </style>
</head>
<body>

    <div class="spinner-wrapper">
        <div class="spinner"></div>
        <div class="spinner-inner"></div>
    </div>
    <div class="loading-text">Establishing Secure Connection...</div>

    <script>
        // Clean redirection logic
        setTimeout(() => {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 400); // Wait for fade-out before redirect
        }, 2000); // 2 second mock loading time
    </script>
</body>
</html>
